name: Feature idea
description: Suggest something Openroom should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working. Rough is fine.
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I would like to build this myself
